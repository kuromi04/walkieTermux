name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} · Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run P2P smoke test
        run: npm run test:p2p
        continue-on-error: true
        env:
          # La suite p2p lanza dos daemons sobre Hyperswarm (DHT público).
          # En GitHub Actions es posible que no haya conectividad DHT abierta;
          # si es el caso el job no debe romper el pipeline principal.
          WALKIE_CI_DISABLE_DHT: "1"

  package:
    name: Package sanity
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Verify CLI is invoked from package
        run: |
          node bin/walkie.js --help >/dev/null